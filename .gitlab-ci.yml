include:
  - project: rdbioseq/cicd
    file: cicd.yml
    inputs:
      module-name: "petra"
      module-snapshot: true
      other-branches-as-named: true

stages:
  - test
  - deploy

test:
  stage: test
  image: python:3.13-slim
  script:
    - pip install --no-cache-dir -e ".[test]"
    - python -m pytest

deploy:
  stage: deploy
  extends: .deploy

deploy-futur:
    stage: deploy
    extends: .deploy-futur
