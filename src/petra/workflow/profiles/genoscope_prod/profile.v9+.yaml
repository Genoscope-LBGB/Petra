executor: slurm
jobs: 100
cores: 4000
latency-wait: 70
# Space status-query retries (~8 min tolerance, below MinJobAge=600s): the slurm
# plugin drops all active jobs when every attempt of a cycle fails, hanging the run.
slurm-status-attempts: 50
max-status-checks-per-second: 0.1

default-resources:
  runtime: 7200
  qos: ngs
  slurm_partition: normal
  threads: 1

set-threads:
  pyrodigal: 12
  cdhit: 12
  diamond: 24
  replace_taxids_with_lineages: 4
  whokaryote: 12
  minimap2: 24
  cmscan: 8
  blastn_ssu: 12
  blastn_lsu: 12
  replace_rrna_taxids_with_lineages: 4
  trnascan: 10

