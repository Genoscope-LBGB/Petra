[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "petra"
version = "0.1.0"
description = "PETRA - Predicted protein-enabled Taxonomic Rank Assignment"
readme = "README.md"
requires-python = ">=3.11"

license = "CECILL-2.1"
license-files = ["LICENSE"]

authors = [
  { name = "Benjamin Istace", email = "benjamin.istace@genoscope.cns.fr" },
]
dependencies = [
  "PyYAML>=6.0,<7",
  "rich>=13.8,<16",
  "snakemake>=9,<10",
  "snakemake-executor-plugin-slurm>=2.7,<3",
  "typer>=0.27,<1",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
petra = "petra.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/petra"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]
